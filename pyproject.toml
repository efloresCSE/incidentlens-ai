[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentlens-ai"
version = "0.1.0"
description = "AI-powered incident detection and analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "pytest-cov", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.mypy]

# Target Python's 3.12 typing rules
python_version = "3.12"

# Require type annotations for functions
disallow_untyped_defs = true

# Report unnecessary type-ignore comments
warn_unused_ignores = true

# Include error codes in error messages
show_error_codes = true
