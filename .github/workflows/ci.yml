
# Name displayed in GitHub's Actions tab
name: Python CI

# Events that trigger this workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum permissions needed to read our repository
permissions:
  contents: read

# Define the jobs in our workflow
jobs:
  test:
    # Use a fresh GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Steps execute in sequence
    steps:
      # Download repository code
      - name: Checkout code
        uses: actions/checkout@v7

      # Configure Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Install our project and pytest
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      
      # Check our Python code for static issues
      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Check Python source code for type errors
      - name: Type check with mypy
        run: python -m mypy src/incidentlens

      # Run unit tests and measure test coverage
      - name: Run tests with coverage
        run: |
          python -m pytest -v \
            --cov=incidentlens \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90

